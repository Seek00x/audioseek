name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Install the built wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel)])
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Test installed package in isolated mode
        run: python -I -m unittest discover -s tests -v
      - name: Check installed launcher
        run: python -I -m audioseek --help
